name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build-and-test:
    # Requires a runner with the macOS 27 SDK (the package's deployment target).
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Swift version
        run: swift --version

      - name: Build (debug)
        run: swift build

      - name: Run unit tests
        run: swift test

      - name: Build release app bundle
        run: make app
